name: PR Auto Approve and Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_approve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Auto approve PR
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN" || { echo "PR_AUTOMATION_TOKEN is not configured"; exit 1; }
          gh pr review "$PR_NUMBER" --repo "$REPO" --approve --body "Automated approval: PR checks passed and the change is ready for deployment."
